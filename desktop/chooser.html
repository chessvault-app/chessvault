<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Chess Vault</title>
    <style>
      /* Mirrors the app's dark theme tokens (web/src/index.css .dark) so the
         chooser reads as page one of the same product. Those tokens are
         written as three numbers — a neutral hue, an accent hue and how far
         each leans — with a contrast knob on top; this window runs before
         any vault or settings exist, so it can only be the DEFAULT scheme,
         resolved by hand. That default is shadcn's neutral (prefs.ts,
         SCHEME_PRESETS[0]): both tints are 0, so every chroma multiplies
         away and the whole window is grey — --bad excepted, being semantic
         and off the tint knobs. Do NOT resolve these from what index.css
         :root declares; those fallbacks are tint 1, which is the Blue
         preset, not what the app boots as. Re-resolve when either moves. */
      :root {
        color-scheme: dark;
        --app-bg: oklch(14.5% 0 0);
        --surface: oklch(20.5% 0 0);
        --surface-2: oklch(26.9% 0 0);
        --surface-inset: oklch(23% 0 0);
        --border: oklch(29% 0 0);
        --border-strong: oklch(40% 0 0);
        --text: oklch(98.5% 0 0);
        --text-muted: oklch(74% 0 0);
        --text-subtle: oklch(68% 0 0);
        --primary: oklch(92.2% 0 0);
        --primary-fg: oklch(20.5% 0 0);
        --bad: oklch(70.4% 0.191 22.2);
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      /* The shell hides the native title bar (main.mjs, TITLE_BAR); this
         page has no band of its own, so its top 32px is the drag region
         the window moves by, under the OS's overlaid controls. */
      .drag {
        position: fixed;
        inset: 0 0 auto 0;
        height: 32px;
        -webkit-app-region: drag;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--app-bg);
        color: var(--text);
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-size: 14px;
      }
      .card {
        width: min(23rem, 90vw);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.6rem;
      }
      /* Bare, in the page's own ink, at the lock screen's size — the app
         wears the mark that way everywhere it is drawn by a PAGE (sidebar,
         lock screen, home header, favicon). A ground survives only on the
         icons an OS composites onto grounds the image cannot see, which
         this is not. The filled tile that used to be here read as a button
         standing above the two that actually are. */
      .logo {
        width: 2.5rem;
        height: 2.5rem;
        margin-bottom: 0.25rem;
      }
      h1 {
        font-size: 1.15rem;
        letter-spacing: -0.01em;
        margin: 0;
      }
      .sub {
        margin: 0 0 0.75rem;
        color: var(--text-subtle);
        font-size: 0.85rem;
      }
      .option {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.8rem 1rem;
        border-radius: 0.75rem;
        border: 1px solid var(--border);
        background: var(--surface);
        color: inherit;
        text-align: left;
        font: inherit;
        cursor: pointer;
        transition: background 0.1s, border-color 0.1s;
      }
      .option:hover {
        background: var(--surface-2);
        border-color: var(--border-strong);
      }
      .option .title {
        font-weight: 600;
        display: block;
      }
      .option .desc {
        color: var(--text-subtle);
        font-size: 0.8rem;
      }
      .option svg {
        width: 1.1rem;
        height: 1.1rem;
        flex: none;
        color: var(--text-subtle);
      }
      form {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .back {
        position: fixed;
        top: 0.9rem;
        left: 0.9rem;
        display: flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.35rem 0.6rem 0.35rem 0.45rem;
        border: none;
        background: none;
        color: var(--text-subtle);
        font: inherit;
        font-size: 0.85rem;
        cursor: pointer;
        border-radius: 0.5rem;
      }
      .back svg {
        width: 0.9rem;
        height: 0.9rem;
      }
      .back:hover {
        color: var(--text);
        background: var(--surface);
      }
      .card {
        animation: rise 0.15s ease-out;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      input {
        flex: 1;
        min-width: 0;
        padding: 0.6rem 0.8rem;
        border-radius: 0.6rem;
        border: 1px solid var(--border);
        background: var(--surface-inset);
        color: inherit;
        font: inherit;
        font-size: 0.85rem;
        outline: none;
      }
      input:focus {
        border-color: var(--primary);
      }
      .connect {
        padding: 0.6rem 1rem;
        border-radius: 0.6rem;
        border: none;
        background: var(--primary);
        color: var(--primary-fg);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .error {
        color: var(--bad);
        font-size: 0.8rem;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="drag"></div>
    <div class="card" id="step1">
      <!-- The app's mark: a hexagon outline with one wedge filled. The same
           drawing as web/src/components/brand-mark.tsx and
           web/public/favicon.svg — copied because this window loads no
           bundle. The knight that used to be here was the mark the app
           retired in a015079e; where the app means "chess" rather than
           itself it still draws a knight, but this is the brand. -->
      <svg class="logo" viewBox="20 20 80 80" fill="currentColor" aria-hidden>
        <path d="M60 24 L91 42 V78 L60 96 L29 78 V42 Z" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="round" />
        <path d="M60 60 L60 24 L91 42 Z" />
      </svg>
      <h1>Chess Vault</h1>
      <p class="sub">Where does your vault live?</p>
      <p class="error" id="error"></p>

      <button class="option" id="local">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden>
          <rect width="14" height="8" x="5" y="2" rx="2" /><rect width="20" height="8" x="2" y="14" rx="2" /><path d="M6 18h2" /><path d="M12 18h6" />
        </svg>
        <span>
          <span class="title">On this computer</span>
          <span class="desc">Self-hosted. Everything runs and stays locally</span>
        </span>
      </button>

      <button class="option" id="remote">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden>
          <circle cx="12" cy="12" r="10" /><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" /><path d="M2 12h20" />
        </svg>
        <span>
          <span class="title">On my server</span>
          <span class="desc">Connect to a Chess Vault server you host</span>
        </span>
      </button>
    </div>

    <div class="card" id="step2" hidden>
      <button class="back" id="back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden>
          <path d="m12 19-7-7 7-7" /><path d="M19 12H5" />
        </svg>
        Back
      </button>
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden>
          <circle cx="12" cy="12" r="10" /><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" /><path d="M2 12h20" />
        </svg>
      </div>
      <h1>Connect to your server</h1>
      <p class="sub">The address of the Chess Vault server you host</p>
      <form id="urlForm">
        <input id="url" type="url" placeholder="https://vault.example.com" required spellcheck="false" />
        <button class="connect" type="submit">Connect</button>
      </form>
      <p class="error" id="remoteError"></p>
    </div>

    <div class="card" id="stepLocal" hidden>
      <button class="back" id="backLocal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden>
          <path d="m12 19-7-7 7-7" /><path d="M19 12H5" />
        </svg>
        Back
      </button>
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden>
          <rect width="14" height="8" x="5" y="2" rx="2" /><rect width="20" height="8" x="2" y="14" rx="2" /><path d="M6 18h2" /><path d="M12 18h6" />
        </svg>
      </div>
      <h1>Open your vault</h1>
      <p class="sub">A vault is a folder of plain files. Pick one, or start fresh with an app-managed folder</p>
      <button class="option" id="pickFolder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden>
          <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z" />
        </svg>
        <span>
          <span class="title">Open a folder…</span>
          <span class="desc">Use an existing vault, or any folder to become one</span>
        </span>
      </button>
      <button class="option" id="defaultVault">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden>
          <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
        </svg>
        <span>
          <span class="title">App-managed vault</span>
          <span class="desc">Kept in your user profile; you can move later</span>
        </span>
      </button>
    </div>
    <script>
      // A packaged app has no terminal, so naming one was sending the
      // reader nowhere. Everything the server said is in a file now, and
      // this says which.
      const params = new URLSearchParams(location.search);
      if (params.get('error') === 'server') {
        const log = params.get('log');
        document.getElementById('error').textContent = log
          ? `The local server did not start. What it said is in ${log}`
          : 'The local server did not start. Check the terminal output.';
      }
      const step1 = document.getElementById('step1');
      const step2 = document.getElementById('step2');
      const stepLocal = document.getElementById('stepLocal');
      const show = (el, other) => {
        other.hidden = true;
        el.hidden = false;
        // retrigger the entrance animation
        el.style.animation = 'none';
        void el.offsetHeight;
        el.style.animation = '';
      };
      document.getElementById('local').onclick = () => show(stepLocal, step1);
      document.getElementById('backLocal').onclick = () => show(step1, stepLocal);
      document.getElementById('defaultVault').onclick = () => window.vaultShell.choose('local');
      document.getElementById('pickFolder').onclick = async () => {
        const dir = await window.vaultShell.pickFolder();
        if (dir) window.vaultShell.choose('local', null, dir);
      };
      document.getElementById('remote').onclick = () => {
        show(step2, step1);
        document.getElementById('url').focus();
      };
      document.getElementById('back').onclick = () => show(step1, step2);
      addEventListener('keydown', (e) => {
        if (e.key !== 'Escape') return;
        if (!step2.hidden) show(step1, step2);
        else if (!stepLocal.hidden) show(step1, stepLocal);
      });
      const remoteError = document.getElementById('remoteError');
      document.getElementById('urlForm').onsubmit = async (e) => {
        e.preventDefault();
        remoteError.textContent = '';
        // choose() ANSWERS: it returns { error } when it refuses the
        // address. Firing and forgetting meant a rejected URL — an http://
        // one, say — looked like a button that simply did nothing.
        const result = await window.vaultShell.choose(
          'remote',
          document.getElementById('url').value.trim(),
        );
        if (result && result.error) remoteError.textContent = result.error;
      };
      // Clear the complaint as soon as they start fixing it.
      document.getElementById('url').oninput = () => {
        remoteError.textContent = '';
      };
    </script>
  </body>
</html>
