[package]
name = "chessvault-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Native pipeline for Chess Vault's reference-games heavy jobs"

[dependencies]
pgn-reader = "0.29.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shakmaty = "0.30.1"
shakmaty-syzygy = "0.28"

[profile.release]
lto = true
