# Build the desktop app for Windows, macOS and Linux on GitHub's own machines.
#
# The macOS build is the point: electron-builder cannot produce a dmg from
# Linux or Windows, so shipping for Mac has meant owning a Mac. GitHub hosts
# macOS runners, so it does not any more. Linux rides along on the same
# matrix — and unlike macOS it needs no signing, no developer account and no
# Gatekeeper exception, so its output is usable the moment it is built.
#
# Run on a tag, this also PUBLISHES: each platform uploads its installers
# and its own manifest to one GitHub release for that tag. Run by hand, it
# only builds, and the installers come back as workflow artifacts.
#
# The three manifests — latest.yml (Windows), latest-mac.yml, latest-linux.yml
# — must land on the SAME release, because electron-updater fetches the one
# for its own platform from a single address. electron-builder finds an
# existing draft for the tag and adds to it, so what has to be prevented is
# two jobs both finding none and both creating one.
#
# This file used to claim a draft was enough on its own. It is not, and 0.6.0
# proved it: Linux and the other two each created a release for v0.6.0 in the
# SAME SECOND, and the installers split across the pair. Both were real, both
# were drafts, and `gh release view v0.6.0` resolves to one of them — so the
# release looked like it had lost the exe, the dmg and two manifests, which
# is indistinguishable from the 0.4.9 empty-draft failure until you list the
# releases by API. Nothing had been lost; it was in a sibling nobody looked at.
#
# So the draft is created ONCE, by the `draft` job below, before any packaging
# starts. The three package jobs only ever find it. `assert-one-release` then
# checks the invariant directly rather than trusting this comment, because
# trusting this comment is exactly what went wrong.
#
# A draft is also the approval gate. Nothing is visible, and no installed app
# is offered the update, until a human presses Publish — which is the moment
# to have checked that the server deploy landed too. In remote mode the
# desktop app runs the SERVER's web build, so an installer released without a
# matching deploy leaves the two disagreeing about what version this is.
# scripts/release.sh does the deploy half and pushes the tag that starts this.
name: desktop

on:
  workflow_dispatch:
  push:
    tags: ['v*']

# Publishing a release is a write to this repository.
permissions:
  contents: write

jobs:
  # The one draft the three package jobs upload into.
  #
  # Its whole purpose is to exist before they start, so that none of them is
  # ever the one to create it. electron-builder's find-or-create is not atomic
  # across runners — two find-nothings a millisecond apart both create — and
  # the loser is invisible to every `gh release` command that takes a tag.
  #
  # Idempotent, because a re-run of a tag that already published must not fail
  # here: if a release for the tag exists at all, draft or not, leave it alone.
  # Tag runs only — a workflow_dispatch build publishes nothing and wants no
  # release created on its behalf.
  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create the draft release for this tag, once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "a release for $TAG already exists — leaving it alone"
          else
            # --notes "" rather than --generate-notes: the body is written by
            # hand from that version's entry in docs/update-log.md, and a wall
            # of generated commit titles is harder to replace than an empty one.
            gh release create "$TAG" --draft --title "${TAG#v}" --notes ""
            echo "created the draft for $TAG"
          fi

  # The starter reference games that ship inside the installer, built here
  # rather than committed. They are derived data — the repo's rule is that
  # derived data is rebuildable and not tracked — and building them per
  # release also keeps them from ageing into a snapshot of whichever month
  # they were first made from.
  #
  # Built ONCE and passed to the three package jobs as an artefact: the work
  # is minutes of CPU, and doing it per platform would triple that for three
  # identical file sets.
  #
  # A server deploy and a source checkout get none of this, by design — they
  # ship the commit, not the release artefacts. Both can build their own
  # (npm run build:refgames, or the Databases page in the app).
  starter-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund

      # Newest month first, falling back: the current month is not published
      # until it is over, and a release cut on the 1st would otherwise fail
      # on a URL that does not exist yet.
      - name: Find the newest published Lichess Elite month
        id: month
        run: |
          # Two things this used to get wrong, both of which stopped a
          # release cold.
          #
          # A status code is not an answer: the mirror serves an HTML page
          # with 200 for a month it does not have, so the HEAD check passed
          # on the first candidate every time and the download then handed
          # unzip a web page. Ask for the first two bytes and insist on a
          # zip's own magic instead.
          #
          # And three months back is not far enough. Publishing pauses: at
          # the time of writing the newest month on the mirror is nine
          # months old, so a window that only ever looked at the last three
          # could not have found anything at all.
          for back in $(seq 1 24); do
            month=$(date -u -d "$back month ago" +%Y-%m)
            url="https://database.nikonoel.fr/lichess_elite_${month}.zip"
            magic=$(curl -sL --max-time 60 -r 0-1 "$url" | head -c 2 || true)
            if [ "$magic" = "PK" ]; then
              echo "month=$month" >> "$GITHUB_OUTPUT"
              echo "url=$url" >> "$GITHUB_OUTPUT"
              echo "using $month"
              exit 0
            fi
          done
          echo "no Lichess Elite zip found in the last two years" >&2
          exit 1

      # Keyed by the month, so a second release in the same month reuses it
      # instead of downloading 80 MB and spending the CPU again.
      - uses: actions/cache@v4
        id: cache
        with:
          path: assets
          key: bundled-dbs-${{ steps.month.outputs.month }}-v2

      - name: Build the starter reference games
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # -f so an error page is an error here rather than a puzzle for
          # unzip two lines down.
          curl -fsSL -o elite.zip "${{ steps.month.outputs.url }}"
          unzip -o -q elite.zip -d elite
          pgn=$(find elite -name '*.pgn' | head -1)
          # Index every game, then keep the strongest of each ECO code. The
          # refgames- prefix is what first-run seeding looks for.
          npx tsx scripts/build-refgames.ts "$pgn"
          npx tsx scripts/build-bundled-refgames.ts --games 50000 \
            --out "assets/refgames-lichess-elite-${{ steps.month.outputs.month }}.sqlite"
          ls -la assets

      - uses: actions/upload-artifact@v7
        with:
          name: bundled-dbs
          path: assets/*.sqlite
          if-no-files-found: error

  package:
    # Both, so nothing packages until the one draft exists. `draft` is skipped
    # on a workflow_dispatch build, and a skipped need would skip this job in
    # turn — hence the explicit result check rather than a bare `needs`.
    needs: [starter-db, draft]
    if: >-
      always()
      && needs.starter-db.result == 'success'
      && (needs.draft.result == 'success' || needs.draft.result == 'skipped')
    strategy:
      # Don't cancel the other platform when one fails: knowing Windows is
      # fine while macOS is broken is more useful than one red X.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: desktop:package
            artifact: windows-installer
            # NSIS installer, its blockmap, and the feed electron-updater reads.
            files: |
              release/installer/*.exe
              release/installer/*.blockmap
              release/installer/latest.yml
          - os: macos-latest
            script: desktop:package:mac
            artifact: macos-installer
            files: |
              release/installer/*.dmg
              release/installer/*.zip
              release/installer/latest-mac.yml
          - os: ubuntu-latest
            script: desktop:package:linux
            artifact: linux-installer
            # AppImage is the one to hand people: a single executable file
            # that needs no install and no package manager. The .deb is for
            # anyone who would rather their system tracked it.
            files: |
              release/installer/*.AppImage
              release/installer/*.deb
              release/installer/latest-linux.yml

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --no-audit --no-fund

      # The engine is copied from node_modules rather than downloaded, so
      # this needs no network beyond the install above.
      - run: npm run setup:engine

      # The starter reference games built by the `starter-db` job.
      # package.json ships assets/ as an extraResource, so they have to be
      # here before electron-builder runs.
      - uses: actions/download-artifact@v7
        with:
          name: bundled-dbs
          path: assets

      # The native fast path (native/, see docs/architecture.md). Built on
      # each runner FOR THAT RUNNER rather than cross-compiled: an installer
      # carries one architecture anyway — electron-builder defaults to the
      # host's, so windows-latest and ubuntu-latest give x64 and macos-latest
      # arm64 — and cargo's default target is the same host every time. A
      # binary for the wrong arch would be dead weight the server then tried
      # to spawn.
      #
      # No toolchain action: GitHub's runner images ship rustup and stable
      # Rust already, and a release pipeline is a poor place to take on a
      # third-party action it does not need.
      #
      # Not `continue-on-error`. Shipping an installer that silently lost its
      # fast path is exactly the failure the 0.4.9 empty-draft taught us to
      # make loud: if this breaks, the release should stop.
      #
      # Cached by the lockfile, restored BEFORE the build: a release that
      # changed no crate reuses the whole 48-crate compile.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: native-${{ runner.os }}-${{ hashFiles('native/Cargo.lock') }}
          restore-keys: native-${{ runner.os }}-

      - name: Build the native core
        run: |
          rustc --version && cargo --version
          cargo build --release --manifest-path native/Cargo.toml

      # On a tag: build and upload to the draft release for that tag.
      # By hand: build only. `--publish never` is explicit rather than
      # implied, so a dispatch run can never surprise anyone by publishing.
      - name: Package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          npm run ${{ matrix.script }} --
          --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}

      # The copy in build-server.mjs is deliberately conditional — a
      # contributor without a Rust toolchain still gets an installer — so a
      # green package step is not proof the fast path went in. On a release
      # runner it MUST have: assert rather than assume, the same lesson as
      # the assets check in scripts/release.sh.
      - name: Assert the native core shipped
        shell: bash
        run: |
          set -euo pipefail
          found=$(ls release/server/chessvault-core release/server/chessvault-core.exe 2>/dev/null || true)
          if [ -z "$found" ]; then
            echo "native core is missing from release/server — this installer would" >&2
            echo "run the JavaScript jobs, which is not what a release ships." >&2
            ls -la release/server >&2
            exit 1
          fi
          ls -l $found

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14

  # The invariant the header used to only assert: ONE release object per tag.
  #
  # Listed by API rather than looked up by tag, because a lookup by tag is
  # precisely what cannot see this failure — it returns one of the duplicates
  # and reports no problem. Runs after packaging, so it also catches a second
  # release created mid-run rather than only at the start.
  #
  # Not fatal to the installers, which are uploaded and kept as artefacts
  # either way; fatal to the run, so nobody publishes half a release believing
  # the green tick.
  assert-one-release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Assert exactly one release exists for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # One id per line across every page, so `wc -l` is the count —
          # `length` per page would need the pages summed.
          ids=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
                  --jq '.[] | select(.tag_name == env.TAG) | .id')
          n=$(printf '%s' "$ids" | grep -c . || true)
          echo "release objects for ${TAG}: ${n}"
          if [ "$n" != "1" ]; then
            echo "expected exactly one release for ${TAG}, found ${n}." >&2
            echo "The installers are split across them, and no single address" >&2
            echo "serves all three updater manifests. Merge the assets onto one" >&2
            echo "release and delete the rest before publishing." >&2
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
              --jq '.[] | select(.tag_name == env.TAG)
                    | "  id=\(.id) draft=\(.draft) assets=\(.assets | length)"' >&2
            exit 1
          fi
