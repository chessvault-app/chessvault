# Build the static demo, and publish it to GitHub Pages — two jobs, on
# purpose.
#
# Building proves the demo still works and costs nothing; publishing puts it
# in front of strangers and cannot be taken back. Split, every release
# verifies the demo builds while going live stays a deliberate act:
#
#   - `publish` is skipped entirely until DEMO_REPO is set, so while the
#     demo is not meant to be public there is nothing to remember and no
#     failing run to learn to ignore;
#   - it runs in the `demo-site` environment, which holds the deploy key and
#     can require an approval — so the irreversible step waits for a person
#     even though the release that triggered it did not.
#
# What lands in the target repository is build output only: minified
# JavaScript, the synthetic seed vault, and the curated CC0 puzzle and game
# subsets. No source maps, no vault data, no book puzzles, no tokens —
# nothing a stranger should not see, whatever this repository's own
# visibility (it is public now; the discipline predates that and stays).
#
# Configured once:
#   - environment `demo-site` with secret DEMO_DEPLOY_KEY: an SSH private
#     key whose public half is a deploy key WITH WRITE ACCESS on the target.
#     A deploy key is scoped to that one repository, unlike a personal
#     token, which is why it is worth the extra step.
#   - repository variable DEMO_REPO, e.g. chessvault-app/chessvault-app.github.io
#
# Triggered by the v* tag scripts/release.sh pushes after verifying the
# installer and the server both report the new version, so the demo can only
# show a version that actually shipped. Not on push to main, which would
# publish work in progress. workflow_dispatch is for rebuilding the demo
# without cutting a release.
name: demo

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Copied from node_modules rather than committed: the demo would ship
      # without an engine otherwise.
      - run: npm run setup:engine

      # The curated databases are built from the full ones, which are far too
      # large to live in a repository. They are committed under
      # web/demo-assets/ precisely so this job does not need them.
      - name: Check the demo databases are present
        run: |
          for f in web/demo-assets/puzzles.sqlite web/demo-assets/refgames.sqlite \
                   web/demo-assets/openings.json; do
            [ -f "$f" ] || { echo "missing $f — run npm run build:demo-dbs and commit it"; exit 1; }
          done

      # The demo's own guards: that it still mounts every route the app has,
      # and that its databases carry every column the queries ask for.
      - run: npx vitest run server/demoStatic.test.ts

      - run: npm run build:site

      # Jekyll would otherwise swallow any path beginning with an underscore.
      - run: touch dist-site/.nojekyll

      - uses: actions/upload-artifact@v7
        with:
          name: demo-site
          path: dist-site
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Nothing to publish to means nothing to do — not a failure. This is what
    # keeps the demo unpublished until you decide otherwise: leave DEMO_REPO
    # unset and releases quietly build it without ever putting it online.
    if: vars.DEMO_REPO != ''
    # Holds the deploy key, and can require an approval before the one step
    # that cannot be undone.
    environment: demo-site
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: demo-site
          path: dist-site

      - name: Publish
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DEMO_DEPLOY_KEY }}
          external_repository: ${{ vars.DEMO_REPO }}
          publish_branch: main
          publish_dir: ./dist-site
          # The target holds build output only, so replacing it wholesale is
          # correct — a leftover file from an older build is a file the app
          # no longer knows about but the browser can still reach.
          force_orphan: true
          commit_message: 'Demo build from ${{ github.sha }}'
