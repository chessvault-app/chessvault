    <style>
      /* Inline, because a stylesheet that has not arrived cannot draw the
         thing that covers the wait for it. */
      /* The same screen the OS drew a moment ago — and it follows the OS,
         NOT the app.

         The two can disagree: a phone in dark mode running an app set to
         light. iOS picks its startup image by the SYSTEM's
         prefers-color-scheme, which is the only thing it can know, so it
         drew the dark one; this screen then read the app's stored
         preference and repainted itself light, and the same knight on
         the same background changed colour under the reader. That is a
         glitch, not a launch.

         So the only rule here is the one iOS used. The app arriving in
         its own theme is a change of the whole screen, which is what a
         change is supposed to look like, and #boot fades rather than
         cuts, so the two schemes cross-fade instead of snapping. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #f9fafc;
      }
      #boot svg { width: 22vmin; height: 22vmin; fill: #0083c1; }
      @media (prefers-color-scheme: dark) {
        #boot { background: #090c12; }
        #boot svg { fill: #49b2f3; }
      }
      /* Added by the script below once it has measured the screen: the
         knight stops being centred in the BOX and is placed on a point
         instead. The box is not consulted, so it stays free to cover the
         viewport. */
      #boot.pinned svg { position: absolute; transform: translate(-50%, -50%); }
      /*
       * There is no fade, and that is the point.
       *
       * This used to go out over 260ms, which sounds gentler and is not:
       * a fade to transparent is a CROSS-fade, so for a quarter of a
       * second the knight and the running app are both on screen, drawn
       * over each other. lanph3re saw it on an iPhone as the nav bar
       * showing through the launch screen, and on an iPad — which has no
       * bottom bar — as a flicker with nothing identifiable in it. Same
       * event, different thing to notice in it.
       *
       * A cut has no such moment. The screen is up, then the app is,
       * which is what every native launch does and what the screen was
       * for in the first place.
       */
      /**
       * No backdrop filters while the launch screen is up.
       *
       * WebKit composites -webkit-backdrop-filter outside the normal paint
       * order: an element that has one can draw OVER a later overlay that
       * covers it, and no z-index on the overlay changes that. The app has
       * exactly two, and they are the phone's bottom bars — so the launch
       * screen covered the whole app except the one strip that had a blur
       * on it, and lanph3re watched a nav bar sit on top of the knight
       * through three fixes aimed at the wrong thing.
       *
       * Nothing is lost by this. A blur behind an opaque screen is a blur
       * nobody can see; the class goes the moment the screen does, and the
       * bars are frosted again before anything can be pressed.
       *
       * The universal selector is deliberate — it is the escape that has
       * to be closed, not one element's use of it, and it is in force for
       * about a second.
       */
      html.booting * {
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
      }
    </style>
    <script>
      // Set the theme class before first paint so dark-theme users never see a
      // white flash. Mirrors the resolution logic in src/store/theme.ts.
      (function () {
        try {
          var raw = localStorage.getItem('chess-vault:theme');
          var pref = raw ? JSON.parse(raw).state.preference : 'system';
          var dark =
            pref === 'dark' ||
            (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* first run, or storage blocked — fall through to light */
        }
      })();
    </script>

  <body>
    <div id="root"></div>
    <!--
      The gap between the OS splash and React.

      The startup images above cover the launch itself, but they go the
      moment the document paints, and the app is not on screen until its
      chunks have downloaded and mounted — an app-coloured nothing, for as
      long as that takes.

      Beside #root rather than inside it, and taken down by main.tsx. It
      used to live inside the container, which React empties on its first
      render — correct, and far too quick to see: the screen vanished on
      the same frame the app appeared, so a cold load flashed it. Out here
      it can outlast the mount by a moment and fade, which is what makes
      it read as a launch rather than as a flicker.

      INSTALLED APPS ONLY — see the script under it.
    -->
    <div id="boot">
      <svg viewBox="4.5 5 36 36" aria-hidden="true">
        <path
          d="M 22,10 C 32.5,11 38.5,18 38,39 L 15,39 C 15,30 25,32.5 23,18 Z M 24,18 C 24.38,20.91 18.45,25.37 16,27 C 13,29 13.18,31.34 11,31 C 9.958,30.06 12.41,27.96 11,28 C 10,28 11.19,29.23 10,30 C 9,30 5.997,31 6,26 C 6,24 12,14 12,14 C 12,14 13.89,12.1 14,10.5 C 13.27,9.506 13.5,8.5 13.5,7.5 C 14.5,6.5 16.5,10 16.5,10 L 18.5,10 C 18.5,10 19.28,8.008 21,7 C 22,7 22,10 22,10 Z"
        />

    <script>
      // An INSTALLED app only, and not the desktop one. This screen exists
      // to cover the handover from the OS splash to React — and a browser
      // tab has no OS splash: the page simply appears, as every other page
      // does, and a full-screen brand card in front of it is a splash
      // screen for its own sake. The desktop shell has none either, and is
      // not getting one; `vaultShell` is the preload's own bridge, so it
      // says that outright rather than leaving it to depend on what
      // Chromium reports display-mode as for an Electron window.
      // Removed here rather than never rendered, so the markup stays one
      // thing that main.tsx knows how to take down.
      (function () {
        var boot = document.getElementById('boot');
        var app =
          matchMedia('(display-mode: standalone)').matches ||
          matchMedia('(display-mode: fullscreen)').matches ||
          matchMedia('(display-mode: minimal-ui)').matches ||
          navigator.standalone === true;
        if (!app || window.vaultShell) {
          boot.remove();
          return;
        }
        // The screen is staying, so nothing may composite its way in front
        // of it — see the html.booting rule. main.tsx clears this when it
        // takes the screen away.
        document.documentElement.classList.add('booting');
        /**
         * Pin the KNIGHT to the screen. Never the box.
         *
         * The startup image iOS just drew is the screen, with the knight
         * at 22% of the screen's short side. This screen was a viewport
         * box with a 22vmin knight in it — the same thing, until the
         * viewport moves. It does: a web app's viewport settles over the
         * first frames of a launch as the status bar and safe areas are
         * accounted for, and every pixel of that resizes the knight and
         * re-centres it. The logo jumped, which is what a launch screen
         * has exactly one job not to do.
         *
         * The first go at this sized the BOX from `screen` and left the
         * knight centred inside it. That fixed the jump and broke the
         * thing the box is for. A fixed element with an explicit height
         * ignores `bottom: 0` — so the screen was only as tall as
         * `screen` claimed, anchored at the top, and anything the claim
         * fell short by was left uncovered. What shows through the gap at
         * the bottom of a phone is the nav bar, which is exactly what
         * lanph3re saw sitting under the knight. The old portrait test
         * made it worse: it read window.innerHeight, which is the number
         * a home-screen launch is documented (in index.css, by us) to get
         * wrong until the first scroll — one bad frame and the box was
         * laid out landscape on a portrait phone, covering less than half
         * the screen.
         *
         * So the two jobs are split. Coverage comes from `inset: 0`,
         * which cannot be short of the viewport whatever the viewport
         * turns out to be. Only the knight is measured, and it is placed
         * on the screen's centre point rather than centred in anything.
         *
         * Orientation is read from screen.orientation, which describes
         * the screen and not the viewport that is still settling; the old
         * test stays as the fallback for anything without it.
         */
        var short = Math.min(screen.width, screen.height);
        var long = Math.max(screen.width, screen.height);
        var type = screen.orientation && screen.orientation.type;
        var portrait = type ? type.indexOf('portrait') === 0 : window.innerHeight >= window.innerWidth;
        var w = portrait ? short : long;
        var h = portrait ? long : short;
        /**
         * And only where the viewport IS the screen.
         *
         * The screen's centre is the right place for the knight exactly
         * when the app fills the screen, which is the case this exists
         * for. Anywhere it does not — an app installed from a desktop
         * browser, which is `standalone` in a window nothing like the
         * size of the monitor — the middle of a 1080p screen can fall
         * outside an 800px window, and the launch screen would have no
         * logo on it at all.
         *
         * Width settles it, because width is the measurement that is not
         * in doubt. It is the DYNAMIC viewport — the height — that a
         * home-screen launch mis-reports; the layout viewport's width is
         * the device's width from the first frame. So a viewport as wide
         * as the screen is a screen-filling launch, and anything else
         * keeps the plain CSS centring it already has.
         */
        if (Math.abs(window.innerWidth - w) <= 4) {
          var svg = boot.querySelector('svg');
          svg.style.width = svg.style.height = Math.round(short * 0.22) + 'px';
          svg.style.left = w / 2 + 'px';
          svg.style.top = h / 2 + 'px';
          boot.classList.add('pinned');
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
