    <!-- Nothing caps the scale: a pinch has to be able to enlarge the app,
         which is WCAG 1.4.4 and the one way to read a phone screen that is
         too small for the eyes using it. maximum-scale=1 and
         user-scalable=no were here until 0.9.6, to stop two fingers on the
         shell zooming the whole page; the reading now is that a gesture
         nobody has to use costs less than an app that cannot be enlarged.
         iOS auto-zoom on a focused field is declined where it is caused
         instead — components/ui/input gives its fields a 16px font on a
         coarse pointer — rather than by taking zooming away from everyone.
         The surfaces that read their own touches hold the page still
         themselves, in their own touch-action: the board, the book
         reader's page, the evidence pages, the opening map and the bottom
         bar. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- The two faces the English shell paints with, asked for before the
         stylesheet arrives: the @font-face rules live in an @import inside
         index.css, so without this the first Pretendard request waited on
         the whole CSS (measured: CSS at 14 ms, first font at 334 ms).
         Subset 91 is the one whose unicode-range carries Latin; the mono
         face is the Latin 400 that clocks and move lists paint with. Paths
         relative to this file (Vite resolves an html href as a file, not a
         package), emitted as the same hashed assets the stylesheet names,
         so the preload and the @font-face fetch one file. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="../node_modules/pretendard/dist/web/variable/woff2-dynamic-subset/PretendardVariable.subset.91.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-400-normal.woff2" />
    <style>
      /* The page's own ground, inline because it must exist before any
         stylesheet. Whatever shows between the OS startup image going and
         the app's first styled frame — module chunks still loading, a
         first install on a cold cache — is this colour, never the
         unstyled document's own white. These two are --background
         resolved by hand for the default scheme (shadcn's neutral, both
         tints 0, contrast 0): oklch 97% is #f5f5f5, not white, and
         oklch 14.5% is #0a0a0a. They move when the tokens do. The media
         query follows the OS for the no-JS case; the theme script below
         then pins the STORED preference inline, which wins, so an app set
         to light on a dark phone gets light, not the OS's guess — and
         pins the ground the page itself last resolved to under its
         chosen scheme (store/theme.ts rememberGround), because a tinted
         or High contrast scheme is not this colour, and a default pinned
         under it showed for one frame before the page's own ground
         painted over it.

         This is ALL that bridges launch now. There used to be an in-page
         launch screen here — a knight over this same ground, taken down
         by main.tsx once the app had painted — and it spent a year
         producing one compositing bug after another: cross-fade
         double-exposure, a nav bar over the knight, a knight that slid
         with the settling viewport, layers escaping visibility:hidden.
         Each fix moved the flicker; none removed it, because a second
         splash after the OS's own is a second handover, and every
         handover is a seam. The OS startup image (head links above) and
         a quiet app-coloured ground have no seam to show. */
      html { background-color: #f5f5f5; }
      @media (prefers-color-scheme: dark) {
        html { background-color: #0a0a0a; }
      }
      /* No mark drawn by the PAGE, ever. The startup images carry one
         (scripts/render-icons.mjs) and it fades out as iOS dissolves the
         image into this plain ground — accepted as benign. A page-drawn
         mark to receive that dissolve is NOT benign: it moves with the
         still-settling launch viewport, twice built and twice measured
         doing so on lanph3re's recordings. Brand on the image, never on
         the page. */
    </style>
    <script>
      // Set the theme class before first paint so dark-theme users never see a
      // white flash. Mirrors the resolution logic in src/store/theme.ts.
      (function () {
        try {
          var raw = localStorage.getItem('chess-vault:theme');
          var pref = raw ? JSON.parse(raw).state.preference : 'system';
          var dark =
            pref === 'dark' ||
            (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          // Pin the page's ground to the RESOLVED theme (inline style beats
          // the media query above): the stored preference can disagree with
          // the OS, and the ground must be the app's colour, not the OS's.
          // The colour is the one the page last resolved to under its
          // scheme, where the app has stored one; the default otherwise.
          var grounds = localStorage.getItem('chess-vault:ground');
          var ground = grounds ? JSON.parse(grounds)[dark ? 'dark' : 'light'] : null;
          document.documentElement.style.backgroundColor =
            typeof ground === 'string' && ground ? ground : dark ? '#0a0a0a' : '#f5f5f5';
        } catch (e) {
          /* first run, or storage blocked — fall through to light */
        }
      })();
    </script>
