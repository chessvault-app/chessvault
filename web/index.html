    <style>
      /* The page's own ground, inline because it must exist before any
         stylesheet. Whatever shows between the OS startup image going and
         the app's first styled frame — module chunks still loading, a
         first install on a cold cache — is this colour, so no path to
         the app is ever white. The media query follows the OS for the
         no-JS case; the theme script below then pins the STORED
         preference inline, which wins, so an app set to light on a dark
         phone gets light, not the OS's guess.

         This is ALL that bridges launch now. There used to be an in-page
         launch screen here — a knight over this same ground, taken down
         by main.tsx once the app had painted — and it spent a year
         producing one compositing bug after another: cross-fade
         double-exposure, a nav bar over the knight, a knight that slid
         with the settling viewport, layers escaping visibility:hidden.
         Each fix moved the flicker; none removed it, because a second
         splash after the OS's own is a second handover, and every
         handover is a seam. The OS startup image (head links above) and
         a quiet app-coloured ground have no seam to show. */
      html { background-color: #f9fafc; }
      @media (prefers-color-scheme: dark) {
        html { background-color: #090c12; }
      }
      /* The knight in #root below: the page's own first paint, until
         React's first commit replaces it. Measured on lanph3re's phone:
         iOS CROSS-DISSOLVES its startup image into the page's first
         paint over ~100 ms, and with a blank first paint the knight
         visibly faded out, sat on nothing for a few frames, then the app
         cut in. With the same knight at the same point (lv units — the
         settled geometry from the first frame, small-viewport fallback
         for engines without them), the dissolve is between identical
         frames and the app's arrival is the only visible change. This is
         CONTENT, not a launch screen: no teardown code, no timing, no
         layers — React swaps it out with the page in one commit, the way
         any loading state leaves. */
      #root > svg {
        position: fixed;
        left: 50vw;
        top: 50vh;
        transform: translate(-50%, -50%);
        width: 22vmin;
        height: 22vmin;
        fill: #0083c1;
      }
      @supports (top: 50lvh) {
        #root > svg {
          left: 50lvw;
          top: 50lvh;
          width: 22lvmin;
          height: 22lvmin;
        }
      }
      @media (prefers-color-scheme: dark) {
        #root > svg { fill: #49b2f3; }
      }
      html.dark #root > svg { fill: #49b2f3; }
    </style>
    <script>
      // Set the theme class before first paint so dark-theme users never see a
      // white flash. Mirrors the resolution logic in src/store/theme.ts.
      (function () {
        try {
          var raw = localStorage.getItem('chess-vault:theme');
          var pref = raw ? JSON.parse(raw).state.preference : 'system';
          var dark =
            pref === 'dark' ||
            (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          // Pin the page's ground to the RESOLVED theme (inline style beats
          // the media query above): the stored preference can disagree with
          // the OS, and the ground must be the app's colour, not the OS's.
          document.documentElement.style.backgroundColor = dark ? '#090c12' : '#f9fafc';
        } catch (e) {
          /* first run, or storage blocked — fall through to light */
        }
      })();
    </script>
